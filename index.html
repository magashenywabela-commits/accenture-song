<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creating great products with Accenture Song's frameworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6FB; --surface:#FFFFFF; --ink:#171A33; --ink-soft:#575B7A; --rule:#DCDFEE; --wash:#ECEEF8;
  --see:#0B7F76; --see-soft:#DDF2EF;
  --solve:#A86400; --solve-soft:#FBEED0;
  --simplify:#4A39C9; --simplify-soft:#E7E4FA;
  --scale:#B01F58; --scale-soft:#F8E0E9;
  --good:#1D7448; --good-soft:#E3F3EA; --bad:#B0342A; --bad-soft:#FAE6E3;
  --font-ui:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-body:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#10122A; --surface:#191C3A; --ink:#ECEEFA; --ink-soft:#A9ADCB; --rule:#2C3060; --wash:#1F2246;
    --see:#3CC5B8; --see-soft:#123A3D;
    --solve:#F0B145; --solve-soft:#3A2E12;
    --simplify:#A398FF; --simplify-soft:#26235A;
    --scale:#FF80AA; --scale-soft:#48192F;
    --good:#58D08E; --good-soft:#143526; --bad:#FF8A7E; --bad-soft:#421C19;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--simplify);outline-offset:2px}
.ph-ink{--ph:var(--ink);--ph-soft:var(--wash)}
.ph-see{--ph:var(--see);--ph-soft:var(--see-soft)}
.ph-solve{--ph:var(--solve);--ph-soft:var(--solve-soft)}
.ph-simplify{--ph:var(--simplify);--ph-soft:var(--simplify-soft)}
.ph-scale{--ph:var(--scale);--ph-soft:var(--scale-soft)}

/* layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--rule);padding:28px 16px 32px}
.brand{font-family:var(--font-ui);font-weight:800;font-size:1.2rem;line-height:1.15;letter-spacing:-.01em;margin:0 6px 6px}
.brand-sub{font-family:var(--font-ui);font-size:.82rem;color:var(--ink-soft);margin:0 6px 16px;line-height:1.4}
.overall{font-family:var(--font-ui);font-size:.8rem;margin:0 6px 8px;color:var(--ink-soft)}
.overall .bar{height:5px;background:var(--rule);border-radius:3px;margin-top:6px;overflow:hidden}
.overall .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.nav-group{font-family:var(--font-ui);font-size:.8rem;font-weight:600;color:var(--ink-soft);margin:20px 6px 6px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid var(--ph);padding:8px 10px 8px 12px;margin:2px 0;cursor:pointer;font-family:var(--font-ui);border-radius:0 6px 6px 0}
.nav-item:hover{background:var(--ph-soft)}
.nav-item[aria-current="true"]{background:var(--ph-soft);font-weight:700}
.nav-item .nt{display:block;font-size:.95rem;line-height:1.3}
.nav-item .nm{display:block;font-size:.74rem;color:var(--ink-soft);margin-top:2px;font-weight:400;line-height:1.35}
.main{padding:44px clamp(20px,5vw,72px) 96px;max-width:980px}
.panel{display:none}
.panel.active{display:block}

/* headings and prose */
.panel h1{font-family:var(--font-ui);font-weight:800;font-size:clamp(2.1rem,4.4vw,3.2rem);line-height:1.04;letter-spacing:-.02em;margin:0 0 14px;max-width:19ch}
.panel h2{font-family:var(--font-ui);font-weight:800;font-size:clamp(1.8rem,3.2vw,2.3rem);line-height:1.1;letter-spacing:-.015em;margin:0 0 6px}
.panel h3{font-family:var(--font-ui);font-weight:700;font-size:1.25rem;line-height:1.25;margin:2.2rem 0 .5rem}
.panel h4{font-family:var(--font-ui);font-weight:700;font-size:1.02rem;margin:1.4rem 0 .3rem}
.dek{font-size:1.2rem;line-height:1.55;color:var(--ink-soft);max-width:58ch;margin:0 0 22px}
.meta{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-soft);margin:0 0 22px}
.prose>p,.prose>ul,.prose>ol,.prose>.callout,.prose>h3,.prose>h4,.prose>.tablewrap{max-width:66ch}
.prose p{margin:.75rem 0}
.prose ul,.prose ol{padding-left:1.3rem;margin:.75rem 0}
.prose li{margin:.35rem 0}
.lede{font-size:1.18rem;line-height:1.6}
.prose a{color:var(--simplify);text-underline-offset:2px}
.prose strong{font-weight:600}

/* callouts */
.objectives,.callout{border-left:4px solid var(--ph,var(--ink));background:var(--ph-soft,var(--wash));padding:14px 18px;margin:1.3rem 0;border-radius:0 8px 8px 0;font-size:.98rem;line-height:1.6}
.objectives{font-family:var(--font-ui)}
.objectives strong,.callout .ct{font-family:var(--font-ui);font-weight:700;display:block;margin-bottom:4px}
.objectives ul{margin:.3rem 0 0;padding-left:1.15rem}
.callout p{margin:.4rem 0}
.callout.warn{--ph:var(--solve);--ph-soft:var(--solve-soft)}

/* tables */
.tablewrap{overflow-x:auto;margin:1.2rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.5;font-family:var(--font-ui)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:700;background:var(--wash)}
td.k{font-weight:600;white-space:nowrap}

/* figures */
.fig{margin:1.8rem 0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 10px 10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:540px;height:auto;margin:0 auto}
.fig figcaption{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-soft);padding:8px 8px 2px;max-width:70ch}
svg text{font-family:var(--font-ui);fill:var(--ink)}
svg .m{fill:var(--ink-soft)}
svg .b{font-weight:700}
svg .w{fill:#fff}
svg .bx{fill:var(--surface);stroke:var(--rule);stroke-width:1.6}
svg .bx-ink{fill:var(--wash);stroke:var(--ink-soft);stroke-width:1.4}
svg .bx-see{fill:var(--see-soft);stroke:var(--see);stroke-width:1.6}
svg .bx-solve{fill:var(--solve-soft);stroke:var(--solve);stroke-width:1.6}
svg .bx-simplify{fill:var(--simplify-soft);stroke:var(--simplify);stroke-width:1.6}
svg .bx-scale{fill:var(--scale-soft);stroke:var(--scale);stroke-width:1.6}
svg .f-ink{fill:var(--ink)} svg .f-see{fill:var(--see)} svg .f-solve{fill:var(--solve)} svg .f-simplify{fill:var(--simplify)} svg .f-scale{fill:var(--scale)}
svg .f-wash{fill:var(--wash)} svg .f-rule{fill:var(--rule)}
svg .ln{stroke:var(--ink-soft);stroke-width:1.6;fill:none}
svg .ln-d{stroke:var(--ink-soft);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
svg .ln-see{stroke:var(--see);stroke-width:2;fill:none}
svg .ln-bad{stroke:var(--bad);stroke-width:1.8;fill:none;stroke-dasharray:4 3}
svg .ln-good{stroke:var(--good);stroke-width:2.4;fill:none}
svg .ring{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-dasharray:6 5}
svg .ring-s{fill:var(--surface);stroke:var(--ink);stroke-width:2}

/* key terms */
.terms{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 18px;font-family:var(--font-ui);font-size:.93rem;margin:.8rem 0;max-width:76ch;line-height:1.5}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--ink-soft)}

/* quiz */
.quiz,.deck,.assess{margin-top:3rem;padding-top:1.4rem;border-top:2px solid var(--ph,var(--ink));font-family:var(--font-ui)}
.quiz h3,.deck h3,.assess h3{margin-top:0}
.q{padding:1.1rem 0;border-bottom:1px solid var(--rule);max-width:70ch}
.q-prompt{font-weight:600;margin:0 0 .7rem;line-height:1.45;font-size:1rem}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;background:var(--surface);border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;line-height:1.45;font-size:.95rem}
.opt:hover{border-color:var(--ink-soft)}
.opt-l{flex:0 0 auto;font-weight:700;width:1.5em;height:1.5em;border-radius:50%;background:var(--wash);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;margin-top:1px}
.q[data-done] .opt{cursor:default}
.q[data-done] .opt:hover{border-color:var(--rule)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .opt-l{background:var(--good);color:#fff}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.opt.incorrect .opt-l{background:var(--bad);color:#fff}
.q-fb{font-size:.92rem;line-height:1.55;margin-top:.7rem;display:none;color:var(--ink)}
.q[data-done] .q-fb{display:block}
.q-fb b.ok{color:var(--good)} .q-fb b.no{color:var(--bad)}
.quiz-sum{font-weight:600;margin:1rem 0 .5rem}
.btn{display:inline-block;font-family:var(--font-ui);font-weight:600;font-size:.92rem;padding:9px 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--surface);cursor:pointer;margin:4px 8px 4px 0}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.88}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface);color:var(--ink)}

/* flashcards */
.deck-stage{max-width:560px}
.deck-count{font-size:.85rem;color:var(--ink-soft);margin:0 0 8px}
.card{perspective:1200px;height:220px;cursor:pointer;outline-offset:4px}
.card-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;border:1.5px solid var(--ph,var(--ink));display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 26px;overflow:auto;line-height:1.5}
.face.front{background:var(--ph-soft,var(--wash));font-weight:700;font-size:1.15rem}
.face.back{background:var(--surface);transform:rotateY(180deg);font-size:.98rem}
@media (prefers-reduced-motion:reduce){
  .card-in{transform:none!important}
  .face.back{transform:none;display:none}
  .card.flipped .face.front{display:none}
  .card.flipped .face.back{display:flex}
}
.deck-hint{font-size:.85rem;color:var(--ink-soft);margin:8px 0 6px}
.deck-done{padding:18px;border:1.5px solid var(--rule);border-radius:10px;background:var(--surface)}

/* assessment */
.arow{padding:12px 0;border-bottom:1px solid var(--rule);max-width:72ch}
.arow p{margin:0 0 8px;font-size:.98rem;line-height:1.45}
.arow .tag{font-weight:700;margin-right:6px}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 14px;cursor:pointer;font-size:.88rem;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.result{margin-top:22px;max-width:640px}
.rbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.rbar .track{height:14px;background:var(--wash);border-radius:7px;overflow:hidden}
.rbar .track i{display:block;height:100%;width:0;background:var(--ph);transition:width .35s}

/* pager */
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--rule)}

@media (max-width:900px){
  .app{display:block}
  .side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:16px 14px 10px}
  .brand-sub,.nav-group,.nm{display:none}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
  .nav-item{width:auto;white-space:nowrap;flex:0 0 auto;border-left:0;border-bottom:4px solid var(--ph);border-radius:6px 6px 0 0;padding:6px 10px}
  .main{padding:26px 18px 72px}
  .terms{grid-template-columns:1fr}
  .rbar{grid-template-columns:110px 1fr 40px}
  .card{height:250px}
}
</style>
</head>

<div class="app">

<script>
const MODULES = [];

<p class="lede">Accenture Song is the part of Accenture that designs and builds products, marketing, commerce and service experiences for large organizations. Its product thinking has no single name or handbook. It is a stack of ideas that arrived through different acquisitions and research programs. This course lines them up so you can use them together.</p>

<figure class="fig">

  <text x="75" y="141" text-anchor="middle" class="m" font-size="11.5">acting on them</text>

  <text x="20" y="254" class="m" font-size="11.5">Do versus say</text>

  <rect x="160" y="176" width="130" height="92" rx="8" class="bx"/>

<h3>Where the ideas come from</h3>
<p>Song was announced in April 2022 as the new name for Accenture Interactive. Its product heritage is layered. Fjord, a service design studio founded in 2001, joined in 2013. MATTER added physical product design in 2017. Bionic, acquired in 2021, brought a venture-style method for building new businesses inside large companies, called the Growth OS. Work & Co, a digital product studio, completed its move to Song in January 2024. In December 2025 Accenture invested in WEVO, an AI research platform, to fold simulated customer testing into Song\u2019s GrowthOS.</p>

  </g>

  <path d="M200,142 L200,166 M412,142 L412,166 M556,142 L556,166" class="ln"/>

  <text x="462" y="58" class="b" font-size="14">Jan 2024</text>

  <text x="200" y="186" text-anchor="middle" class="b" font-size="14">2017</text>
  <text x="200" y="205" text-anchor="middle" font-size="12.5">MATTER</text>
  <text x="200" y="222" text-anchor="middle" class="m" font-size="12">Physical product design</text>

<h3>The four verbs</h3>
<p>Song\u2019s strategy work reduces to four verbs: <strong>see</strong> customers as people, <strong>solve</strong> for relevance, <strong>simplify</strong> for ease of experience, and <strong>scale</strong> for growth. The 2022 life centricity playbook used the first three. The 2023 growth and product innovation report added scale as the fourth. Product teams meet them in that order, but the loop repeats: what you learn at scale feeds the next round of seeing.</p>

<h3>Why Song says this is urgent</h3>
<p>Song surveyed 1,700 C-suite leaders across two waves in 2022. In the second wave, more than 95 percent said their customers were changing faster than they could change their businesses. A few months earlier the figure had been 88 percent. Nearly all executives were speeding up their digital transformations, yet 97 percent admitted that this at best lets them keep pace and does not create new growth. The companies that were pulling ahead were not doing more of the same. They were using technology creatively to solve emerging customer needs.</p>

<h3>What the modeling claims</h3>
<p>Song built a capability score for life centricity and modeled how companies with high scores compared with peers. It predicts that leaders are about 3 times more likely to beat peers on speed to market and nearly 5 times more likely to beat them on customer lifetime value. The model also predicts that leaders outgrow peers by about nine percentage points a year. For a $10 billion company, that is the gap between adding roughly $4 billion of revenue over five years and losing about $1 billion.</p>
<div class="callout warn"><span class="ct">Read these as modeled, not measured</span>

<h3>Cadence and behavior</h3>
<p>Seeing is a habit, not a project. In Song\u2019s 2023 survey of 970 executives, companies that revalidated their products and services at least once a year showed a 24 percent higher revenue growth rate between 2020 and 2022 than peers who revalidated less often. Of the companies that used emerging technology to keep in sync with customer needs, 83 percent also validated those needs at least annually.</p>
<p>The same report stresses the gap between what people say and what they do. It recommends watching behavior and tracking quiet signals early, before they become obvious trends. Generative AI can help by digging into niche details that get lost when data is aggregated, but it still needs human judgment to decide what is real. Companies can also build funnels that feed several listening streams into one model of each customer, so nuance is not lost in oversimplification.</p>

<h3>How Life Trends is made</h3>
<p>Life Trends is Song\u2019s annual report on shifts in human behavior and attitudes. The 2025 edition was billed as the 18th and the 2026 edition as the 19th. The 2026 edition describes the method: designers, creatives, technologists, sociologists and anthropologists across more than 40 design studios and creative agencies study signals of change in their countries and pitch trend ideas in workshops. A smaller team then synthesizes the pitches, interviews senior leaders across industries plus academics and futurists, and shapes the trends. Consumer survey data backs each edition.</p>

<h4>The 2025 trends, from the primary report</h4>
<ul>
  <li><strong>Cost of hesitations.</strong> People increasingly doubt what they see online. Sixty percent said they questioned the authenticity of online content more than before.</li>
  <li><strong>The parent trap.</strong> Parents and policymakers push for guardrails on young people\u2019s online lives.</li>
  <li><strong>Impatience economy.</strong> People look to peers and crowds for faster routes to health, wealth and happiness. Sixty-three percent get inspiration from social media on doing things smarter.</li>
  <li><strong>The dignity of work.</strong> Employees feel emotionally distant from transactional work, and employee experience shapes customer experience.</li>
  <li><strong>Social rewilding.</strong> Forty-two percent said their most enjoyable experience of the past week was physical, against fifteen percent for a digital one.</li>
</ul>
<h4>The 2026 trends, from secondary summaries</h4>
<ul>
  <li><strong>Stability premium.</strong> People value reassurance, predictability and trust.</li>
  <li><strong>Human journeys.</strong> Progress, mastery and purpose matter more than speed.</li>
  <li><strong>Finding Neo.</strong> AI should serve human experience, in a world where AI summaries replace many site visits.</li>
  <li><strong>Good vibrations.</strong> Joy, play and real-world connection are becoming commercial signals.</li>
  <li><strong>Coming of age.</strong> Ambition, energy and consumption are no longer tied to age.</li>
</ul>

<h3>Where the Growth OS comes from</h3>
<p>Bionic, acquired in 2021, packaged a method for large companies to create new businesses the way founders and early-stage investors do. Its co-founder David Kidder and Christina Wallace wrote it up in <em>New to Big</em>. The premise is that established firms are skilled at making big businesses bigger but poor at discovering new ones. They argue that entrepreneurship and venture capital are, together, a form of management for discovering and building new businesses, and that a company needs it alongside the management of its existing ones.</p>
<p>The book\u2019s recurring principles, as its publisher summarizes them, are to focus on what consumers do rather than what they say, to celebrate productive failure, to take a portfolio approach, and to learn from the outside in. Kidder has also argued that most organizations do not have a talent or money problem but a permissions problem, and that leaders must tolerate views that are not yet consensus. At the time of the acquisition Bionic had about 40 entrepreneurs, growth investors and designers. Clients included P&G, Exelon and AB InBev\u2019s ZX Ventures. Kidder\u2019s speaker bio claims that more than 100 Fortune 500 companies have adopted the Growth OS, a self-reported figure.</p>

<h3>Steering a portfolio</h3>
<p>The 2023 growth report links several governance habits to growth. Firms whose executive committees, trained in growth strategy, reviewed the portfolio more often showed a 69 percent uplift in growth from inorganic sources and 39 percent from organic ones. Firms that increased their focus on scaling experiments and validating the portfolio faster showed a 22 percent boost. Firms that phased out old products quickly had 19 percent higher revenue growth from new and organic sources. The report also recommends venture studios or accelerators that create, test and scale ideas outside the core business. One consumer goods executive described going from zero to a hundred in a week, with 100 to 200 prototyped ideas to refine. As before, these are correlations from a survey.</p>

<h3>AI in the loop</h3>
<p>Song argues that generative AI shortens the path from idea to evidence. It can do the heavy lifting of validation and prototyping while humans protect relevance, responsibility and quality. Because AI has a low cost of creation, a team can test many versions of an ad or a site rather than a single clickable prototype. In December 2025 Accenture invested in WEVO so that GrowthOS can test value propositions and product experiences with synthetic personas and real users, with results in hours rather than weeks. In a 2025 conference session, a Song presenter reported roughly a 12 percent conversion lift within a few weeks for some clients, which is a single self-reported figure.</p>
<div class="callout warn"><span class="ct">Synthetic users have limits</span>
<p>The same session was careful to call synthetic users an expansion of the research toolkit and not a replacement. It asked teams to design their process so that nobody over-trusts synthetic insight before real users confirm it. Use simulation to generate hypotheses and narrow the field, then validate the important bets with real behavior.</p></div>

<p>Song\u2019s own description names desirability and viability. Design thinking usually adds feasibility, and the table uses all three. This is standard practice, offered here as a way to apply the stages.</p>
<div class="tablewrap"><table>

</tbody></table></div>

<h3>Simplicity outside comes from simplicity inside</h3>
<p>The 2023 growth report goes further than the playbook. It argues that a great product is not enough, because the experience around it, from purchase to servicing, must be great too, and that any complexity can become a fatal flaw. Its answer is to remove internal complexity: break down silos and flatten hierarchies so people can act fast on customer problems. Companies that integrated their customer-facing functions, led by empathy, showed a 39 percent uplift in inorganic revenue growth. Those that built products that evolved with customers\u2019 lives showed a 22 percent increase. And 67 percent of companies that used empathy and inclusion at speed in product development outperformed peers on customer satisfaction. As always, these are survey associations.</p>

<h3>Four cases and what each teaches</h3>

<h4>IHG: a delivery system, not just an app</h4>
<p>IHG, with 17 brands and more than 6,000 hotels, needed a new mobile app for two priority groups: loyalty members, its largest user group, and hotel owners, who benefit when bookings come through owned channels rather than commissioned third-party sites. A reskin was not an option because outdated infrastructure would have piled up technical debt and complexity. The app also had to run on iOS and Android, in 18 languages, across every brand and property.</p>
<p>Song and IHG built a flexible delivery model, called a digital factory, that made development predictable, repeatable and reliable at scale. It can scale up or down with business cycles, run several upgrades in parallel, and bring in specialist talent when needed. The launch was staged: from 12 users close to the program to thousands of IHG employees, owners, partners and corporate customers, then a phased public release and full launch in late May 2022. Compared with pre-pandemic levels, revenue, usage and downloads were each up more than 20 percent by September 2022. The app also holds a 4.9-star iOS rating and won three Webby Awards in 2024.</p>

<p><strong>Lessons:</strong> design for every stakeholder who depends on the product, invest in a repeatable delivery system, and expose the product to more people only as evidence accumulates.</p>

<h4>Generali: design and IT in one room</h4>
<p>The insurer Generali saw that a smooth experience was essential to lifetime customer relationships, and that the best experiences come from design and IT working together. It brought the two teams together to create a mobile app for customers, and later a hub for agents, through a series of quick-turnaround design collaborations that included people from across the business. <strong>Lesson:</strong> the org chart shows up in the product, so co-locate the disciplines that must agree.</p>

<h4>Minna Bank: architecture as product strategy</h4>
<p>Fukuoka Financial Group found that few services matched what digital-native customers in Japan wanted. Rather than adding an app to an old bank, it created Minna Bank, a digital bank on a full cloud banking system. It is mobile-first, shows aggregated activity across several banks, and uses QR codes for deposits and transfers. Its cloud system also supports banking as a service through flexible APIs, so non-financial companies can embed banking in their own offerings. <strong>Lesson:</strong> a platform choice can turn one product into an ecosystem.</p>

<h4>Prada: craft standards plus reusable engineering</h4>
<p>Prada wanted an online customization experience for its America\u2019s Cup sneaker that matched luxury standards. Song and Prada built a digital twin of the shoe and a 3D configurator that loads in seconds across browsers and devices. With more than 50 million possible configurations, pre-rendering images was impossible, so the team built a rendering server that produces high-resolution images of each custom design in real time and feeds them to fulfillment systems. The web configurator launched in four months, an in-store version followed three weeks later, and the same approach was later used for the Galleria handbag. <strong>Lesson:</strong> keep the fidelity bar high, and build the engine so the second product is cheaper than the first.</p>

<h3>Craft practices in Song\u2019s product roles</h3>
<p>Song\u2019s public job descriptions for digital product designers offer a peek at working practice. They describe prototyping at rising fidelity, from paper sketches to Figma or coded prototypes, and defining and maintaining design systems that guide a product across its life. They also mention producing design principles, task flows and wireframes for key screen types across devices, and working closely with agile development teams so the design intent survives implementation. These postings are indicative, not an official method statement.</p>

<div class="callout"><span class="ct">Try it: map your continuum</span>
<p>List every step a person takes from first hearing about your product to getting help after buying. For each handoff between teams or tools, note what the person has to repeat or re-learn. Those handoffs are where your complexity tax is being collected.</p></div>

  content:`
<p class="lede">AI changes products twice. It changes how you make them, which Modules 5 and 7 covered. It also changes who your product must please: the person, and increasingly the software acting on their behalf.</p>

<h3>From off-the-shelf to on-the-fly</h3>
<p>Song\u2019s 2023 growth report describes generative AI moving design from typing commands into a machine to telling it what is wanted and getting it. That points to products created dynamically around a person\u2019s stated desire, rather than pre-packaged options they must wade through. The report links self-adapting products, the kind that evolve with customers\u2019 lives, to a 22 percent increase in inorganic revenue growth. It also warns of a side effect. When AI makes competent output nearly free to produce, average work becomes abundant, so the differentiators are relevance, trust and craft.</p>

<h3>The engagement gap</h3>
<p>A January 2025 Song-led report on consumer technology found that AI-integrated devices were launching quickly while sales lagged. It called the difference between promise and perceived value the engagement gap. Its prescription is to design and market technology for consumers, not at them, across five points:</p>
<ol>
  <li><strong>Define what \u201Cgood\u201D looks like.</strong> Balance broad appeal with personal relevance and state practical benefits. Many products are pitched as game-changers without showing how they improve daily life.</li>
  <li><strong>Simplify complexity.</strong> Make setup easier and emphasize practical benefits. A fifth of consumers prefer a cautious approach to new technology.</li>
  <li><strong>Surprise and delight with user-centric innovation.</strong> Only 13 percent of consumers say they are always keen to adopt new tech at launch, so simplify disruptive features to reduce hesitation.</li>
  <li><strong>Market transparently.</strong> Seventy-one percent were confused by the terminology used to explain features, so plain, relatable language builds trust.</li>
  <li><strong>Make trust your edge.</strong> Only 39 percent of consumers trust companies to have good intentions and 43 percent trust their claims to be honest, so visible security and honesty differentiate.</li>
</ol>

<h3>Trust and authenticity</h3>
<p>The 2025 Life Trends report found 60 percent of respondents questioning the authenticity of online content more than before. It recommended that brands establish clear ways for customers to verify their authenticity. The 2026 trend called Finding Neo, as summarized in secondary sources, argues from the other side that AI has to serve the human experience and not dominate it. The two ideas share a design implication: AI features earn use when people can see what they do and why.</p>

<h3>Agentic commerce: a second audience</h3>
<p>Song\u2019s April 2026 agentic commerce report argues that this is a generational reset, not a new channel. Brands now have two audiences: the person and the AI agent acting for them. Agents can compare products, read fine print, choose a winner, and complete purchase, delivery and returns without human effort. The report cites several signals. Ninety percent of frequent AI users in North America said they would consider switching from a preferred brand if their assistant found a better one. A Song simulation expected up to 45 percent of shoppers to move at least half of their commerce activity into agent-mediated ecosystems within two years. And 25 percent of executives expect AI agents to be their top audience for content within three years.</p>
<p>Brands face two strategies. Most must become the <strong>choice of agents</strong>, meaning their product data is structured so agents can understand features, compare warranties and return policies, and select them in seconds. A few category leaders can become the <strong>agent of choice</strong>, meaning the agent that people and other agents turn to. That takes deep domain expertise, first-party data, integrated services and the ability to curate journeys end to end. Song\u2019s example is Noli, a beauty tech venture backed by L\u2019Or\u00E9al and powered by Accenture, where 98 percent of a small sample of 164 users reported a positive match.</p>

<h3>How much will people delegate?</h3>
<p>A June 2026 Song consumer survey of 25,590 people in 16 countries measured appetite for delegation. It found a ladder in which each higher rung of autonomy draws fewer takers. People adjust the dial per decision: the same person might delegate a grocery restock but keep travel booking. The report says the boundary is set by what carries personal meaning, such as identity, relationships and self-expression, rather than by task complexity. It also finds that agents reward proof: verified claims, clean product data, transparent pricing, reliable availability and successful fulfillment. Its shorthand is that brands must earn value twice, once with the person\u2019s heart and once with the agent\u2019s algorithm.</p>

<h3>Five design checks for an AI-enabled product</h3>
<p>These are the course\u2019s synthesis of the reports above.</p>
<ol>
  <li><strong>Delegation.</strong> Which decisions can a person hand over, and can they move that dial up or down at any time?</li>
  <li><strong>Meaning.</strong> Where does the task carry identity, relationships or self-expression, and so where should a human stay in the loop?</li>
  <li><strong>Verifiability.</strong> What can an agent confirm about your product today? Is the data structured, current and true?</li>
  <li><strong>Trust cues.</strong> Where does the product ask for trust, and what visible proof does it offer?</li>
  <li><strong>Human service.</strong> Does the AI serve the person\u2019s experience, or does it replace parts they valued?</li>

<h3>Reading the evidence like a skeptic</h3>
<ul>
  <li><strong>Whose data?</strong> Most figures are Accenture\u2019s own surveys and models, and Song sells services that follow these frameworks.</li>
  <li><strong>Correlation, not cause.</strong> Firms that revalidate yearly may simply be better run in many ways. The surveys cannot separate those explanations.</li>
  <li><strong>Selected stories.</strong> Client case studies are chosen by the firm and rarely show failures.</li>
  <li><strong>Self-reported claims.</strong> Executive expectations, a speaker-bio adoption count and a presenter\u2019s conversion lift are all self-reported.</li>
  <li><strong>Small samples.</strong> Noli\u2019s 98 percent positive match comes from 164 users.</li>
  <li><strong>Simulated users.</strong> Synthetic research is fast, but it is a stand-in for real behavior.</li>
  <li><strong>Familiar ingredients.</strong> In this course\u2019s reading, much of the method resembles established practice: design thinking, lean experimentation, venture building and jobs-to-be-done. What looks distinctive is the emphasis on outside life forces, on connecting marketing, product and service, and on organizational velocity.</li>
  <li><strong>No independent evaluation.</strong> I did not find independent studies testing whether these frameworks improve outcomes.</li>
</ul>

<h3>What I could not verify</h3>
<ul>
  <li>The full 2026 Life Trends report was not accessible to me. The 2026 trend descriptions come from secondary sources.</li>
  <li>Song\u2019s Growth &amp; Product Innovation service page has moved, so the stage sequence in Module 5 comes from a search snapshot.</li>

</ul>

<h3>A four-week way to try it</h3>
<ol>
  <li><strong>Week 1, see.</strong> Write the life-force brief for one product and pull the behavior data that tests it.</li>

  <li><strong>Week 3, prove.</strong> Run one cheap test with a behavioral signal and agree in advance what would make you stop.</li>
  <li><strong>Week 4, simplify and scale.</strong> Map the continuum, mark the handoffs, and put revalidation and retirement dates on the calendar.</li>

  {q:'Eighty-one percent say they can generate creative ideas but only 16 percent very frequently turn them into growth. What does this imply?', options:['Ideas are the bottleneck.','Execution is the bottleneck, so build the infrastructure of commitment, structure and expertise.','AI should replace creatives.','Creativity is overrated.'], correct:1, explain:'The report frames applied creativity as a leadership and infrastructure issue.'},
  {q:'What does the investment and growth gap suggest about spending more on new products?', options:['It guarantees faster growth.','Spending alone does not ensure growth; velocity and relevance matter.','It always lowers growth.','It only matters for small firms.'], correct:1, explain:'Most firms invested more, yet many still had single-digit growth or decline.'},
  {q:'What is the engagement gap?', options:['Low employee morale.','The difference between the promise of AI-integrated products and the value people perceive.','A gap in server capacity.','The difference between two age groups.'], correct:1, explain:'It describes AI products that launch with big promises but face weak adoption.'},
  {q:'In agentic commerce, which move makes a brand more likely to be selected by an agent?', options:['Hiding pricing details.','Publishing structured, verifiable product data with reliable fulfillment.','Using vaguer marketing claims.','Restricting all data access.'], correct:1, explain:'Agents reward proof: verified claims, clean product data, transparent pricing and reliable availability.'},
  {q:'According to the June 2026 survey, which share would let an agent act fully autonomously on purchases?', options:['74%','32%','9%','90%'], correct:2, explain:'74% would delegate task execution, 32% would delegate decisions within limits, and 9% would allow autonomous purchasing.'},
  {q:'Which is the best summary of Song\u2019s product thinking for a practitioner?', options:['Build features faster than competitors.','See people in their changing lives, solve a real need, prove it with behavior, simplify the whole experience, and scale with velocity, with AI as accelerator and audience.','Copy competitors\u2019 roadmaps.','Focus only on branding.'], correct:1, explain:'The loop joins Song\u2019s four verbs, with AI as a thread through each move.'}
);

(function(){
const COURSE_TITLE = 'Creating great products with Accenture Song\u2019s frameworks';
const state = {quiz:{}, cards:{}, assess:{count:0,total:ASSESS.length}, active:'m1'};
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function shuffled(arr){
  const a = arr.map((v,i)=>({v:v,i:i}));
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function readMins(html){
  const t = html.replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<[^>]+>/g,' ');
  const w = t.split(/\s+/).filter(Boolean).length;
  return Math.max(3, Math.round(w/200));
}

const PANELS = MODULES.map(m => ({id:m.id, title:m.title, group:m.group, phase:m.phase, mod:m}));
PANELS.push({id:'playbook', title:CAPSTONE.title, group:CAPSTONE.group, phase:CAPSTONE.phase, mod:CAPSTONE, capstone:true});
PANELS.push({id:'review', title:'Cumulative review', group:'Apply', phase:'ink', review:true});

const totalQuiz = MODULES.reduce((n,m)=>n+m.quiz.length,0) + FINAL_QUIZ.length;
const totalCards = MODULES.reduce((n,m)=>n+m.flashcards.length,0);
const totalMins = MODULES.reduce((n,m)=>n+readMins(m.content),0) + readMins(CAPSTONE.content);

/* ---------- progress ---------- */
function updateMeta(id){
  const n = $('#nm-'+id); if(!n) return;
  const q = state.quiz[id], c = state.cards[id];
  const parts = [];
  if(id==='playbook'){ parts.push(state.assess.count ? 'Self-check '+state.assess.count+' of '+state.assess.total : 'Self-check not started'); }
  else {
    parts.push(q && q.answered ? 'Quiz '+q.correct+' right of '+q.answered+' answered' : 'Quiz not started');
    if(c) parts.push(c.seen ? 'Cards '+c.seen+' of '+c.total+' reviewed' : 'Cards not started');
  }
  n.innerHTML = parts.join('<br>');
}
function updateOverall(){
  let a = 0;
  Object.keys(state.quiz).forEach(k => { a += state.quiz[k].answered; });
  $('#overall').innerHTML = 'Progress: '+a+' of '+totalQuiz+' quiz questions answered<div class="bar"><i style="width:'+Math.round(a/totalQuiz*100)+'%"></i></div>';
}

/* ---------- quiz ---------- */
function buildQuiz(modId, questions, title){
  const block = el('section','quiz');
  block.appendChild(el('h3', null, title || 'Check your understanding'));
  const stat = state.quiz[modId] = {answered:0, correct:0, total:questions.length};
  const sum = el('p','quiz-sum'); sum.setAttribute('aria-live','polite');
  questions.forEach((item, qi) => {
    const q = el('div','q');
    const p = el('p','q-prompt'); p.textContent = (qi+1)+'. '+item.q; q.appendChild(p);
    const opts = el('div','opts');
    const fb = el('div','q-fb'); fb.setAttribute('aria-live','polite');
    const order = shuffled(item.options);
    order.forEach((o, oi) => {
      const b = el('button','opt'); b.type='button';
      b.innerHTML = '<span class="opt-l">'+String.fromCharCode(65+oi)+'</span><span class="opt-t"></span>';
      b.querySelector('.opt-t').textContent = o.v;
      b.dataset.right = (o.i === item.correct) ? '1' : '';
      b.addEventListener('click', () => {
        if(q.dataset.done) return;
        q.dataset.done = '1';
        const ok = b.dataset.right === '1';
        [].forEach.call(opts.children, x => { if(x.dataset.right==='1') x.classList.add('correct'); });
        if(!ok) b.classList.add('incorrect');
        fb.innerHTML = (ok ? '<b class="ok">Correct.</b> ' : '<b class="no">Not quite.</b> ');
        fb.appendChild(document.createTextNode(item.explain));
        stat.answered++; if(ok) stat.correct++;
        if(stat.answered === stat.total){
          sum.textContent = 'You got '+stat.correct+' of '+stat.total+' right.';
          const again = el('button','btn','Try again with shuffled options');
          again.type='button';
          again.onclick = () => { const nb = buildQuiz(modId, questions, title); block.replaceWith(nb); updateMeta(modId); updateOverall(); nb.scrollIntoView({block:'start'}); };
          sum.appendChild(document.createElement('br')); sum.appendChild(again);
        } else {
          sum.textContent = stat.correct+' right so far, '+stat.answered+' of '+stat.total+' answered.';
        }
        updateMeta(modId); updateOverall();
      });
      opts.appendChild(b);
    });
    q.appendChild(opts); q.appendChild(fb); block.appendChild(q);
  });
  block.appendChild(sum);
  return block;
}

/* ---------- flashcards ---------- */
function buildDeck(modId, cards){
  const sec = el('section','deck');
  sec.appendChild(el('h3', null, 'Flashcards'));
  const stage = el('div','deck-stage'); sec.appendChild(stage);
  const info = state.cards[modId] = {seen:0, total:cards.length};
  const seenSet = new Set();
  let queue = [], pos = 0, knew = 0, missed = [];
  const all = cards.map((_,i)=>i);
  function start(list){ queue = list.slice(); pos = 0; knew = 0; missed = []; render(); }
  function done(){
    stage.innerHTML = '';
    const box = el('div','deck-done');
    box.innerHTML = '<p><strong>You knew '+knew+' of '+queue.length+'.</strong></p>';
    if(missed.length){
      const r = el('button','btn primary','Review missed ('+missed.length+')'); r.type='button';
      r.onclick = () => start(missed); box.appendChild(r);
    }
    const s = el('button','btn','Start over'); s.type='button'; s.onclick = () => start(all); box.appendChild(s);
    stage.appendChild(box);
  }
  function render(){
    stage.innerHTML = '';
    if(pos >= queue.length){ done(); return; }
    const c = cards[queue[pos]];
    stage.appendChild(el('p','deck-count','Card '+(pos+1)+' of '+queue.length));
    const card = el('div','card'); card.tabIndex = 0; card.setAttribute('role','button');
    card.setAttribute('aria-label','Flashcard. Press Enter or Space to flip.');
    card.innerHTML = '<div class="card-in"><div class="face front"></div><div class="face back"></div></div>';
    card.querySelector('.front').textContent = c.front;
    card.querySelector('.back').textContent = c.back;
    stage.appendChild(card);
    stage.appendChild(el('p','deck-hint','Answer in your head, then flip the card.'));
    const row = el('div');
    const miss = el('button','btn','Missed it'); miss.type='button'; miss.disabled = true;
    const got = el('button','btn primary','Got it'); got.type='button'; got.disabled = true;
    function flip(){ card.classList.toggle('flipped'); if(card.classList.contains('flipped')){ miss.disabled = false; got.disabled = false; } }
    card.addEventListener('click', flip);
    card.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flip(); } });
    function rate(ok){
      seenSet.add(queue[pos]); info.seen = seenSet.size;
      if(ok) knew++; else missed.push(queue[pos]);
      pos++; updateMeta(modId); updateOverall(); render();
      const nc = $('.card', stage); if(nc) nc.focus({preventScroll:true});
    }
    miss.onclick = () => rate(false); got.onclick = () => rate(true);
    row.appendChild(miss); row.appendChild(got); stage.appendChild(row);
  }
  start(all);
  return sec;
}

/* ---------- self-assessment ---------- */
const PH = [
  {id:'see', label:'See', mod:'m3', ph:'see'},
  {id:'solve', label:'Solve', mod:'m4', ph:'solve'},
  {id:'build', label:'Build and validate', mod:'m5', ph:'solve'},
  {id:'simplify', label:'Simplify', mod:'m6', ph:'simplify'},
  {id:'scale', label:'Scale', mod:'m7', ph:'scale'},
  {id:'ai', label:'AI era', mod:'m8', ph:'ink'}
];
function buildAssessment(mount){
  const answers = {};
  const labels = ['Not yet','Partly','Yes'];
  const list = el('div');
  const result = el('div','result'); result.setAttribute('aria-live','polite');
  ASSESS.forEach((a, i) => {
    const row = el('div','arow');
    const p = el('p'); p.textContent = a.q; row.appendChild(p);
    const seg = el('div','seg'); seg.setAttribute('role','group'); seg.setAttribute('aria-label', a.q);
    labels.forEach((l, v) => {
      const b = el('button', null, l); b.type='button'; b.setAttribute('aria-pressed','false');
      b.onclick = () => {
        answers[i] = v;
        [].forEach.call(seg.children, (x, xi) => x.setAttribute('aria-pressed', xi===v ? 'true' : 'false'));
        state.assess.count = Object.keys(answers).length; updateMeta('playbook'); draw();
      };
      seg.appendChild(b);
    });
    row.appendChild(seg); list.appendChild(row);
  });
  function draw(){
    result.innerHTML = '';
    const n = Object.keys(answers).length;
    if(!n){ return; }
    result.appendChild(el('h4', null, 'Your profile'));
    const scores = PH.map(ph => {
      let sum = 0, cnt = 0, tot = 0;
      ASSESS.forEach((a, i) => { if(a.phase === ph.id){ tot++; if(answers[i] !== undefined){ sum += answers[i]; cnt++; } } });
      return {ph:ph, pct: Math.round(sum/(2*tot)*100), cnt:cnt, tot:tot};
    });
    scores.forEach(s => {
      const r = el('div','rbar ph-'+s.ph.ph);
      r.innerHTML = '<span></span><span class="track"><i style="width:'+s.pct+'%"></i></span><span>'+s.pct+'%</span>';
      r.firstChild.textContent = s.ph.label;
      result.appendChild(r);
    });
    if(n < ASSESS.length){
      result.appendChild(el('p', null, 'Answer all '+ASSESS.length+' statements for your full picture ('+n+' answered so far).'));
    } else {
      const min = Math.min.apply(null, scores.map(s => s.pct));
      const weakest = scores.filter(s => s.pct === min);
      const names = weakest.map(s => s.ph.label).join(' and ');
      result.appendChild(el('p', null, '<strong>Weakest area: '+names+'.</strong> Start with '+(weakest.length>1 ? 'those modules' : 'that module')+'.'));
      weakest.forEach(s => {
        const b = el('button','btn primary','Open the '+s.ph.label+' module'); b.type='button';
        b.onclick = () => showPanel(s.ph.mod); result.appendChild(b);
      });
    }
  }
  mount.appendChild(list); mount.appendChild(result);
}

/* ---------- panels ---------- */
function buildPager(idx){
  const pg = el('div','pager');
  if(idx > 0){
    const b = el('button','btn','Previous: '+PANELS[idx-1].title); b.type='button'; b.onclick = () => showPanel(PANELS[idx-1].id); pg.appendChild(b);
  } else { pg.appendChild(el('span')); }
  if(idx < PANELS.length-1){
    const b = el('button','btn primary','Next: '+PANELS[idx+1].title); b.type='button'; b.onclick = () => showPanel(PANELS[idx+1].id); pg.appendChild(b);
  }
  return pg;
}
function buildPanel(p, idx){
  const sec = el('section','panel ph-'+p.phase); sec.id = 'panel-'+p.id;
  if(p.review){
    sec.appendChild(el('h2', null, 'Cumulative review'));
    sec.appendChild(el('p','meta', FINAL_QUIZ.length+' questions from every module. Options are shuffled each time you try.'));
    sec.appendChild(buildQuiz('review', FINAL_QUIZ, 'Mixed questions'));
    sec.appendChild(buildPager(idx));
    return sec;
  }
  const m = p.mod;
  if(m.hero){
    sec.appendChild(el('h1', null, COURSE_TITLE));
    sec.appendChild(el('p','dek', m.dek));
    sec.appendChild(el('p','meta', MODULES.length+' modules, '+totalQuiz+' quiz questions, '+totalCards+' flashcards, a playbook and a cumulative review. About '+totalMins+' minutes of reading in total.'));
  } else {
    sec.appendChild(el('h2', null, p.title));
    sec.appendChild(el('p','meta', 'About '+readMins(m.content)+' minutes to read'+(m.quiz ? ', then a quiz and flashcards.' : '.')));
  }
  if(m.objectives){
    sec.appendChild(el('div','objectives','<strong>By the end you can</strong><ul>'+m.objectives.map(o=>'<li>'+o+'</li>').join('')+'</ul>'));
  }
  sec.appendChild(el('div','prose', m.content));
  if(m.keyTerms && m.keyTerms.length){
    const kt = el('div','prose');
    kt.innerHTML = '<h3>Key terms</h3><dl class="terms">'+m.keyTerms.map(t=>'<dt>'+t.term+'</dt><dd>'+t.def+'</dd>').join('')+'</dl>';
    sec.appendChild(kt);
  }
  if(m.quiz && m.quiz.length) sec.appendChild(buildQuiz(m.id, m.quiz));
  if(m.flashcards && m.flashcards.length) sec.appendChild(buildDeck(m.id, m.flashcards));
  if(p.capstone){ const mount = $('#assess-mount', sec); if(mount) buildAssessment(mount); }
  sec.appendChild(buildPager(idx));
  return sec;
}

function showPanel(id){
  state.active = id;
  [].forEach.call(document.querySelectorAll('.panel'), s => s.classList.toggle('active', s.id === 'panel-'+id));
  [].forEach.call(document.querySelectorAll('.nav-item'), b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
const nav = $('#nav'), main = $('#main');
let lastGroup = null;
PANELS.forEach((p, idx) => {
  if(p.group !== lastGroup){
    lastGroup = p.group;
    nav.appendChild(el('div','nav-group', p.group));
  }
  const b = el('button','nav-item ph-'+p.phase);
  b.type='button'; b.dataset.id = p.id; b.setAttribute('aria-current', idx===0 ? 'true' : 'false');
  b.innerHTML = '<span class="nt"></span><span class="nm" id="nm-'+p.id+'"></span>';
  b.querySelector('.nt').textContent = p.title;
  b.onclick = () => showPanel(p.id);
  nav.appendChild(b);
  main.appendChild(buildPanel(p, idx));
  updateMeta(p.id);
});
showPanel('m1');
updateOverall();
})();
</script>
